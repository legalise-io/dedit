name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            collab-server/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: make test-install
      - run: make check test-coverage build check-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.json
            frontend/coverage/
            collab-server/coverage/
